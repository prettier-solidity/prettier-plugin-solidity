name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: lint
        run: npm run lint

  test_bundle:
    name: Test production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright/package.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: Build test app
        run: npm run build:test
      - name: Run tests
        run: npm run test:standalone -- --runInBand
      - name: Run tests in Chromium
        run: npm run test:browser -- --runInBand
      - name: Run tests in Firefox
        run: npm run test:browser -- --runInBand
        env:
          TEST_RUNTIME_BROWSER: firefox
      - name: Run tests in Safari
        run: npm run test:browser -- --runInBand
        env:
          TEST_RUNTIME_BROWSER: webkit

  test:
    name: Test on ${{ matrix.name }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, image: ubuntu-latest, node: 22 }
          - { name: Linux, image: ubuntu-latest, node: 24 }
          - { name: Linux, image: ubuntu-latest, node: 26 }
          - { name: MacOS, image: macos-latest, node: 22 }
          - { name: Windows, image: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm run test:all -- --runInBand
